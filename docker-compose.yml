services:
  falkordb:
    image: falkordb/falkordb:latest
    ports: ["6379:6379", "3000:3000"]
  app:
    build: .
    environment:
      FALKORDB_HOST: falkordb
      PORT: "8080"
    ports: ["8080:8080"]
    depends_on: [falkordb]
  simulator:
    build: .
    command: ["node", "src/simulator.js"]
    environment:
      API: http://app:8080
      SIM_SESSIONS: "4"
    depends_on: [app]
